name: Release

# Builds the Windows installer on a version tag and attaches it to a GitHub
# Release. The bundled binaries (~220 MB) are fetched during the build and are
# NOT committed, so they are downloaded fresh here.
#
# Trigger: push a tag like v0.1.0
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  installer:
    name: Build installer + publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch bundled binaries
        shell: bash
        run: ./scripts/fetch-binaries.sh

      - name: Build app + installer (per-user, LZMA)
        shell: bash
        run: |
          "$(go env GOPATH)/bin/wails" build -nsis -clean -platform windows/amd64 -installscope user

      - name: List build output
        shell: bash
        run: ls -lh build/bin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/bin/*-installer.exe
